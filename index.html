  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sugar Rush 🍬</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient background orbs -->
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="bg-orb orb3"></div>

  <div class="game-wrapper">

    <!-- Header -->
    <header class="hud">
      <div class="hud-card score-card">
        <span class="hud-label">SCORE</span>
        <span class="hud-value" id="score">0</span>
      </div>

      <div class="hud-title">
        <span class="title-text">Sugar<br>Rush</span>
        <span class="title-candy">🍬</span>
      </div>

      <div class="hud-card moves-card">
        <span class="hud-label">MOVES</span>
        <span class="hud-value" id="moves">30</span>
      </div>
    </header>

    <!-- Grid -->
    <main class="board-container">
      <div class="board" id="board"></div>
    </main>

    <!-- Combo burst text -->
    <div class="combo-burst" id="comboBurst"></div>

  </div>

  <!-- Game Over Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-emoji">🍭</div>
      <h2 class="modal-title">Sugar Rush Over!</h2>
      <p class="modal-sub">You crushed it!</p>
      <div class="modal-score-box">
        <span class="modal-score-label">FINAL SCORE</span>
        <span class="modal-score-value" id="finalScore">0</span>
      </div>
      <button class="play-again-btn" id="playAgainBtn">Play Again 🍬</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
    
  </body>
  
</html>
